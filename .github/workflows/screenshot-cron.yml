name: Delta Exchange Screenshot Cron

on:
  schedule:
    # 5:30 AM IST (00:00 UTC) - Monday to Friday
    - cron: '0 0 * * 1-5'
    # 9:35 PM IST (16:05 UTC) - Monday to Friday
    - cron: '5 16 * * 1-5'
    # 10:00 PM IST (16:30 UTC) - Monday to Friday
    - cron: '30 16 * * 1-5'

  workflow_dispatch:

jobs:
  take-screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Install Chrome Browser for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run Screenshot Automation Script
        run: |
          node -e '
          const puppeteer = require("puppeteer");
          const fs = require("fs");
          const path = require("path");

          (async () => {
            console.log("Launching headless browser...");
            const browser = await puppeteer.launch({
              args: [
                "--no-sandbox", 
                "--disable-setuid-sandbox", 
                "--disable-dev-shm-usage", 
                "--disable-gpu",
                "--window-size=1440,1400"
              ]
            });

            const page = await browser.newPage();
            // Expanded height to ensure all three charts are fully visible
            await page.setViewport({ width: 1440, height: 1600 });

            console.log("Navigating to Delta Exchange options analytics...");
            await page.goto("https://www.delta.exchange/app/options_analytics", { 
              waitUntil: "networkidle2", 
              timeout: 60000 
            });

            console.log("Waiting for page elements to load...");
            await new Promise(resolve => setTimeout(resolve, 6000));

            console.log("Switching all chart dropdowns from BTC to XAUT...");
            try {
              // Loop to find and change every chart dropdown showing BTC to XAUT
              for (let i = 0; i < 3; i++) {
                const clicked = await page.evaluate(() => {
                  const elements = Array.from(document.querySelectorAll("div, button, span"));
                  const target = elements.find(el => el.textContent.trim() === "BTC" && el.offsetParent !== null && (el.className.includes("dropdown") || el.className.includes("select") || el.querySelector("svg") || el.innerHTML.includes("svg")));
                  if (target) {
                    target.click();
                    return true;
                  }
                  return false;
                });

                if (clicked) {
                  await new Promise(resolve => setTimeout(resolve, 1500));
                  await page.evaluate(() => {
                    const options = Array.from(document.querySelectorAll("div, span, li, option"));
                    const xaut = options.find(el => el.textContent.trim() === "XAUT" && el.offsetParent !== null);
                    if (xaut) {
                      xaut.click();
                    }
                  });
                  await new Promise(resolve => setTimeout(resolve, 1500));
                } else {
                  break;
                }
              }
            } catch (e) {
              console.log("Dropdown loop note:", e.message);
            }

            console.log("Waiting 12 seconds for all XAUT charts to render fully...");
            await new Promise(resolve => setTimeout(resolve, 12000));

            const dir = path.join(process.cwd(), "screenshots");
            if (!fs.existsSync(dir)) {
              fs.mkdirSync(dir, { recursive: true });
            }

            const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
            const filePath = path.join(dir, `xaut-${timestamp}.png`);

            console.log("Taking screenshot...");
            await page.screenshot({ path: filePath, fullPage: true });
            console.log(`Successfully saved screenshot to ${filePath}`);

            await browser.close();
          })().catch(err => {
            console.error("Error during screenshot execution:", err);
            process.exit(1);
          });
          '

      - name: Commit and Push Screenshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-captured XAUT multi-chart analytics screenshot [skip ci]'
          branch: main
