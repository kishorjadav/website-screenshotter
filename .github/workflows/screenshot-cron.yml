name: Scheduled Website Screenshotter

on:
  schedule:
    # 5:30 AM IST (12:00 UTC) - Mon-Fri
    - cron: '0 12 * * 1-5'
    # 9:35 PM IST (16:05 UTC) - Mon-Fri
    - cron: '5 16 * * 1-5'
    # 10:00 PM IST (16:30 UTC) - Mon-Fri
    - cron: '30 16 * * 1-5'

  workflow_dispatch:

jobs:
  take-screenshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install puppeteer

      - name: Run Screenshot Script
        run: node take-screenshot.js

      - name: Commit and Push Screenshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-captured screenshot [skip ci]'
          branch: main
