name: Scheduled Website Screenshotter

on:
  schedule:
    # 5:30 AM IST (12:00 UTC) - Mon-Fri
    - cron: '0 12 * * 1-5'
    # 9:35 PM IST (16:05 UTC) - Mon-Fri
    - cron: '5 16 * * 1-5'
    # 10:00 PM IST (16:30 UTC) - Mon-Fri
    - cron: '30 16 * * 1-5'

  workflow_dispatch:

jobs:
  take-screenshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Create Screenshot Script
        run: |
          cat << 'EOF' > capture.js
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');

          async function run() {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 1200 });

            console.log('Navigating to Delta Exchange...');
            await page.goto('https://www.delta.exchange/app/options_analytics', { waitUntil: 'networkidle0', timeout: 60000 });

            console.log('Waiting for charts to render...');
            // Wait up to 15 seconds for the canvas or SVG elements (charts) to appear on the page
            try {
              await page.waitForSelector('canvas, svg', { timeout: 15000 });
            } catch (e) {
              console.log('Timeout waiting for selector, capturing current state...');
            }

            // Extra buffer to ensure data populates
            await new Promise(r => setTimeout(r, 5000));

            const dir = path.join(__dirname, 'screenshots');
            if (!fs.existsSync(dir)) fs.mkdirSync(dir);

            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const filePath = path.join(dir, `screenshot-${timestamp}.png`);

            await page.screenshot({ path: filePath, fullPage: true });
            console.log(`Saved screenshot to ${filePath}`);

            await browser.close();
          }
          run().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Run Screenshot Script
        run: node capture.js

      - name: Commit and Push Screenshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-captured loaded screenshot [skip ci]'
          branch: main
