name: Delta Exchange Screenshot Cron

on:
  schedule:
    # 5:33 AM IST (00:03 UTC) - Monday to Friday
    - cron: '3 0 * * 1-5'
    # 6:33 AM IST (01:03 UTC) - Monday to Friday
    - cron: '3 1 * * 1-5'
    # 8:05 AM IST (02:35 UTC) - Monday to Friday
    - cron: '35 2 * * 1-5'
    # 10:33 AM IST (05:03 UTC) - Monday to Friday
    - cron: '3 5 * * 1-5'
    # 11:48 AM IST (06:18 UTC) - Monday to Friday
    - cron: '18 6 * * 1-5'
    # 2:03 PM IST (08:33 UTC) - Monday to Friday
    - cron: '33 8 * * 1-5'
    # 4:33 PM IST (11:03 UTC) - Monday to Friday
    - cron: '3 11 * * 1-5'
    # 5:33 PM IST (12:03 UTC) - Monday to Friday
    - cron: '3 12 * * 1-5'
    # 6:33 PM IST (13:03 UTC) - Monday to Friday
    - cron: '3 13 * * 1-5'
    # 9:40 PM IST (16:10 UTC) - Monday to Friday
    - cron: '10 16 * * 1-5'
    # 10:33 PM IST (17:03 UTC) - Monday to Friday
    - cron: '3 17 * * 1-5'

  workflow_dispatch:

jobs:
  take-screenshot:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Install Chrome Browser for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run Screenshot Automation Script
        run: node screenshot.js

      - name: Get Current Date and Time
        id: datetime
        run: echo "NOW=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Commit and Push Screenshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'XAUT at ${{ env.NOW }}'
          branch: main
