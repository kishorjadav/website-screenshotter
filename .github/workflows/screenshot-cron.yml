name: Delta Exchange Screenshot Cron

on:
  schedule:
    # 5:30 AM IST (00:00 UTC) - Monday to Friday
    - cron: '0 0 * * 1-5'
    # 9:35 PM IST (16:05 UTC) - Monday to Friday
    - cron: '5 16 * * 1-5'
    # 10:00 PM IST (16:30 UTC) - Monday to Friday
    - cron: '30 16 * * 1-5'

  workflow_dispatch:

jobs:
  take-screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Install Chrome Browser for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run Screenshot Automation Script
        run: |
          node -e '
          const puppeteer = require("puppeteer");
          const fs = require("fs");
          const path = require("path");

          (async () => {
            console.log("Launching headless browser...");
            const browser = await puppeteer.launch({
              args: [
                "--no-sandbox", 
                "--disable-setuid-sandbox", 
                "--disable-dev-shm-usage", 
                "--disable-gpu",
                "--window-size=1440,1600"
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 1600 });

            console.log("Navigating to Delta Exchange options analytics...");
            await page.goto("https://www.delta.exchange/app/options_analytics", { 
              waitUntil: "networkidle2", 
              timeout: 60000 
            });

            console.log("Waiting for page elements to load...");
            await new Promise(resolve => setTimeout(resolve, 6000));

            console.log("Switching all three chart dropdowns to XAUT strictly...");
            try {
              await page.evaluate(async () => {
                const sleep = (ms) => new Promise(r => setTimeout(r, ms));
                
                // Find all dropdown triggers currently showing a coin ticker
                const findTriggers = () => Array.from(document.querySelectorAll("div, button, span")).filter(el => {
                  const t = el.textContent.trim();
                  return (t === "BTC" || t === "ETH" || t === "XAUT") && el.offsetParent !== null && el.clientHeight < 50;
                });

                let triggers = findTriggers();
                for (let i = 0; i < triggers.length; i++) {
                  triggers = findTriggers();
                  if (!triggers[i]) break;

                  const trigger = triggers[i];
                  if (trigger.textContent.trim() === "XAUT") continue;

                  trigger.click();
                  await sleep(1000);

                  // Search for exact XAUT option in the opened dropdown list
                  const options = Array.from(document.querySelectorAll("div, span, li, option"));
                  const xautOpt = options.find(o => o.textContent.trim() === "XAUT" && o.offsetParent !== null);
                  
                  if (xautOpt) {
                    xautOpt.click();
                    await sleep(1200);
                  } else {
                    // Fallback: type XAUT if search input exists
                    const input = document.querySelector("input[placeholder*=\"Search\"], input[type=\"text\"]");
                    if (input) {
                      input.value = "XAUT";
                      input.dispatchEvent(new Event("input", { bubbles: true }));
                      await sleep(1000);
                      const filteredOpt = Array.from(document.querySelectorAll("div, span, li")).find(o => o.textContent.trim() === "XAUT" && o.offsetParent !== null);
                      if (filteredOpt) filteredOpt.click();
                    }
                  }
                  await sleep(1000);
                }
              });
            } catch (e) {
              console.log("Dropdown automation error:", e.message);
            }

            console.log("Waiting 12 seconds for all XAUT charts to render fully...");
            await new Promise(resolve => setTimeout(resolve, 12000));

            const dir = path.join(process.cwd(), "screenshots");
            if (!fs.existsSync(dir)) {
              fs.mkdirSync(dir, { recursive: true });
            }

            const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
            const filePath = path.join(dir, `xaut-${timestamp}.png`);

            console.log("Taking screenshot...");
            await page.screenshot({ path: filePath, fullPage: true });
            console.log(`Successfully saved screenshot to ${filePath}`);

            await browser.close();
          })().catch(err => {
            console.error("Error during screenshot execution:", err);
            process.exit(1);
          });
          '

      - name: Commit and Push Screenshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-captured XAUT strict selection screenshot [skip ci]'
          branch: main
