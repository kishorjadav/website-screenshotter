name: Delta Exchange Screenshot Cron

on:
  schedule:
    # 5:30 AM IST (00:00 UTC) - Monday to Friday
    - cron: '0 0 * * 1-5'
    # 9:35 PM IST (16:05 UTC) - Monday to Friday
    - cron: '5 16 * * 1-5'
    # 10:00 PM IST (16:30 UTC) - Monday to Friday
    - cron: '30 16 * * 1-5'

  workflow_dispatch:

jobs:
  take-screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Install Chrome Browser for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run Screenshot Automation Script
        run: |
          node -e '
          const puppeteer = require("puppeteer");
          const fs = require("fs");
          const path = require("path");

          (async () => {
            console.log("Launching headless browser...");
            const browser = await puppeteer.launch({
              args: [
                "--no-sandbox", 
                "--disable-setuid-sandbox", 
                "--disable-dev-shm-usage", 
                "--disable-gpu",
                "--window-size=1440,1200"
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 1200 });

            console.log("Navigating to Delta Exchange options analytics...");
            await page.goto("https://www.delta.exchange/app/options_analytics", { 
              waitUntil: "networkidle2", 
              timeout: 60000 
            });

            console.log("Waiting for page elements to load...");
            await new Promise(resolve => setTimeout(resolve, 6000));

            console.log("Attempting to switch asset from BTC to XAUT...");
            try {
              // Find and click the asset dropdown trigger (usually displaying BTC)
              const clickedDropdown = await page.evaluate(() => {
                const elements = Array.from(document.querySelectorAll("div, span, button"));
                const target = elements.find(el => el.textContent.trim() === "BTC" && el.offsetParent !== null);
                if (target) {
                  target.click();
                  return true;
                }
                return false;
              });

              if (clickedDropdown) {
                console.log("Dropdown clicked, searching for XAUT option...");
                await new Promise(resolve => setTimeout(resolve, 2000));

                // Click the XAUT option from the opened menu list
                await page.evaluate(() => {
                  const options = Array.from(document.querySelectorAll("div, span, li"));
                  const xaut = options.find(el => el.textContent.trim() === "XAUT" && el.offsetParent !== null);
                  if (xaut) {
                    xaut.click();
                  }
                });
              } else {
                console.log("Could not find BTC dropdown selector element directly.");
              }
            } catch (e) {
              console.log("Error interacting with asset dropdown:", e.message);
            }

            console.log("Waiting 10 seconds for XAUT charts and analytics to render fully...");
            await new Promise(resolve => setTimeout(resolve, 10000));

            const dir = path.join(process.cwd(), "screenshots");
            if (!fs.existsSync(dir)) {
              fs.mkdirSync(dir, { recursive: true });
            }

            const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
            const filePath = path.join(dir, `xaut-${timestamp}.png`);

            console.log("Taking screenshot...");
            await page.screenshot({ path: filePath, fullPage: true });
            console.log(`Successfully saved screenshot to ${filePath}`);

            await browser.close();
          })().catch(err => {
            console.error("Error during screenshot execution:", err);
            process.exit(1);
          });
          '

      - name: Commit and Push Screenshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-captured XAUT options analytics screenshot [skip ci]'
          branch: main
